<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apartments Tukano — Mahahual, Costa Maya</title>
  <meta name="description" content="Fully furnished 2 and 3-bedroom apartments in Mahahual, Mexico. Steps from the Caribbean on the Costa Maya." />
  <meta name="keywords" content="Mahahual vacation rentals, Apartments Tukano, best places to stay in Costa Maya, furnished apartments Mahahual" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--teal:#2DC6B8;--teal-d:#1A9E92;--yellow:#F5C518;--orange:#E05A1E;--ink:#111;--off:#F8F5EE;--dark:#1C1C1C;--mid:#2A2A2A;}
    *{scroll-behavior:smooth;box-sizing:border-box;}
    body{font-family:'Jost',sans-serif;color:var(--ink);background:#fff;margin:0;}
    h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;}
    #root{position:relative;}
    #root::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");opacity:0.35;}
    .nav-link{position:relative;font-family:'Jost',sans-serif;font-weight:400;letter-spacing:.09em;font-size:.78rem;text-transform:uppercase;cursor:pointer;padding-bottom:2px;}
    .nav-link::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;background:var(--teal);transition:width .3s;}
    .nav-link:hover::after{width:100%;}
    .cta-btn{background:var(--teal);color:#111;font-family:'Jost',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.7rem;padding:12px 26px;border:none;cursor:pointer;transition:background .25s,transform .2s;display:inline-flex;align-items:center;gap:8px;}
    .cta-btn:hover{background:var(--yellow);transform:translateY(-2px);}
    .ghost-btn{background:transparent;color:white;font-family:'Jost',sans-serif;font-weight:400;letter-spacing:.12em;text-transform:uppercase;font-size:.7rem;padding:12px 26px;border:1px solid rgba(255,255,255,.28);cursor:pointer;transition:border-color .25s,background .25s;}
    .ghost-btn:hover{border-color:var(--teal);background:rgba(45,198,184,.08);}
    .card-lift{transition:transform .35s,box-shadow .35s;}
    .card-lift:hover{transform:translateY(-6px);box-shadow:0 24px 56px rgba(0,0,0,.13);}
    .amenity-card{border:1px solid rgba(45,198,184,.18);transition:border-color .3s,background .3s;}
    .amenity-card:hover{border-color:rgba(45,198,184,.55);background:rgba(45,198,184,.04);}
    .explore-1{background:linear-gradient(140deg,#0d3d38,#2DC6B8);}
    .explore-2{background:linear-gradient(140deg,#111,#1a9e92);}
    .explore-3{background:linear-gradient(140deg,#8B5E3C,#E8C99A);}
    .tag-pill{background:rgba(45,198,184,.15);color:#1A9E92;border:1px solid rgba(45,198,184,.3);font-family:'Jost',sans-serif;font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:999px;display:inline-block;}
    .feat-chip{background:rgba(45,198,184,.1);color:var(--teal-d);border:1px solid rgba(45,198,184,.25);font-family:'Jost',sans-serif;font-size:.7rem;font-weight:500;letter-spacing:.05em;padding:5px 12px;border-radius:999px;display:inline-block;margin:3px 3px 3px 0;}
    .divider-line{width:52px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,var(--teal),var(--yellow));}
    .map-grid{background:linear-gradient(135deg,#e8f5f3,#c0e8e4);position:relative;overflow:hidden;}
    .map-grid::before{content:'';position:absolute;inset:0;
      background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(45,198,184,.1) 40px),
                       repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(45,198,184,.1) 40px);}
    .form-input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:white;font-family:'Jost',sans-serif;font-size:.88rem;font-weight:300;padding:13px 16px;border-radius:3;outline:none;transition:border-color .25s;box-sizing:border-box;}
    .form-input:focus{border-color:rgba(45,198,184,.6)!important;outline:none;}
    .form-input::placeholder{color:rgba(255,255,255,.3);}
    .form-select option{background:#1c1c1c;color:white;}
    .icon-input{position:relative;}
    .icon-input svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:rgba(255,255,255,.2);}
    .icon-input .form-input{padding-left:34px;}
    .icon-textarea svg{position:absolute;left:12px;top:14px;pointer-events:none;color:rgba(255,255,255,.18);}
    .icon-textarea{position:relative;}
    .icon-textarea .form-input{padding-left:34px;resize:vertical;min-height:120px;}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .float{animation:float 5s ease-in-out infinite;}
    @keyframes fadein{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{opacity:0;transform:translateY(28px);transition:opacity .75s ease,transform .75s ease;}
    .fade-in.visible{opacity:1;transform:translateY(0);}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-thumb{background:var(--teal);border-radius:2px;}
    @media(max-width:768px){
      .hide-mob{display:none!important;}
      .show-mob{display:flex!important;}
      .two-col{grid-template-columns:1fr!important;}
      .three-col{grid-template-columns:1fr!important;}
      .contact-grid{grid-template-columns:1fr!important;}
      .footer-cols{grid-template-columns:1fr!important;gap:28px!important;}
      .apt-cards{grid-template-columns:1fr!important;}
    }
    @media(min-width:769px){.show-mob{display:none!important;}}
  </style>
</head>

/* ── Hooks ── */
function useScrollY() {
  const [y, setY] = useState(0);
  useEffect(() => {
    const h = () => setY(window.scrollY);
    window.addEventListener("scroll", h, { passive: true });
    return () => window.removeEventListener("scroll", h);
  }, []);
  return y;
}

function useFadeIn(delay = 0) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    el.classList.add("fade-in");
    if (delay) el.style.transitionDelay = delay + "s";
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { el.classList.add("visible"); obs.disconnect(); }
    }, { threshold: 0.1 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}

function FadeIn({ children, delay = 0 }) {
  const ref = useFadeIn(delay);
  return <div ref={ref} className="fade-in" style={{ transitionDelay: delay + "s" }}>{children}</div>;
}

function SLabel({ children, light = false }) {
  return (
    <span style={{ display:"inline-block", letterSpacing:"0.25em", fontSize:"0.68rem", fontWeight:600,
      textTransform:"uppercase", color: light ? "rgba(245,197,24,0.8)" : "#B8760A",
      marginBottom:12, fontFamily:"'Jost',sans-serif" }}>
      {children}
    </span>
  );
}

function FieldLabel({ children }) {
  return (
    <label style={{ display:"block", fontFamily:"'Jost',sans-serif", fontSize:".65rem", fontWeight:600,
      letterSpacing:".15em", textTransform:"uppercase", color:"rgba(255,255,255,.4)", marginBottom:7 }}>
      {children}
    </label>
  );
}

                    <div>
                      <FieldLabel>{copy.contact.type}</FieldLabel>
                      <select className="form-input form-select" value={form.type} onChange={setField("type")} style={{ cursor:"pointer" }}>
                        <option value="">—</option>
                        {copy.contact.typeOptions.map(o => <option key={o} value={o}>{o}</option>)}
                      </select>
                    </div>
                  </div>
                  <div style={{ marginBottom:20 }}>
                    <FieldLabel>{copy.contact.message} *</FieldLabel>
                    <div className="icon-textarea">
                      {I("MessageSquare",13,"rgba(255,255,255,.18)")}
                      <textarea className="form-input" rows={5} value={form.message} onChange={setField("message")} placeholder={copy.contact.placeholder} />
                    </div>
                  </div>
                  {formState === "error" && (
                    <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14, color:"#f88", fontFamily:"'Jost',sans-serif", fontSize:".8rem" }}>
                      {I("AlertCircle",14,"#f88")} {copy.contact.errorMsg}
                    </div>
                  )}
                  <div style={{ display:"flex", alignItems:"center", gap:16, flexWrap:"wrap" }}>
                    <button className="cta-btn" onClick={handleSubmit} disabled={formState==="sending"}
                      style={{ opacity: formState==="sending" ? 0.7 : 1, padding:"14px 32px" }}>
                      {I("Send",13)} {formState==="sending" ? copy.contact.sending : copy.contact.send}
                    </button>
                    <span style={{ fontFamily:"'Jost',sans-serif", fontSize:".7rem", color:"rgba(255,255,255,.28)", fontWeight:300 }}>
                      Replies to aaron@vanwachem.ca
                    </span>
                  </div>
                </div>
              </div>
            </FadeIn>
          )}
        </div>
      </section>

      {/* ── LOCATION ── */}
      <section id="location" style={{ background:"var(--off)", padding:"96px 0" }}>
        <div style={{ maxWidth:1180, margin:"0 auto", padding:"0 24px" }}>
          <FadeIn>
            <div style={{ textAlign:"center", marginBottom:56 }}>
              <SLabel>Where To Find Us</SLabel>
              <h2 style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"clamp(2rem,4vw,3.2rem)", fontWeight:300, margin:"0 0 12px", color:"#111" }}>{copy.location.title}</h2>
              <p style={{ fontFamily:"'Jost',sans-serif", color:"#777", fontSize:".95rem", fontWeight:300 }}>{copy.location.sub}</p>
              <div className="divider-line" />
            </div>
          </FadeIn>
          <div className="two-col" style={{ display:"grid", gridTemplateColumns:"1fr 2fr", gap:40, alignItems:"start" }}>
            <FadeIn>
              <div>
                <div style={{ display:"flex", alignItems:"flex-start", gap:12, marginBottom:24 }}>
                  {I("MapPin",17,"var(--teal)",{marginTop:3,flexShrink:0})}
                  <div>
                    <p style={{ fontFamily:"'Jost',sans-serif", fontSize:".82rem", fontWeight:500, color:"#222", margin:"0 0 3px" }}>Address</p>
                    <p style={{ fontFamily:"'Jost',sans-serif", fontSize:".82rem", fontWeight:300, color:"#666", margin:0, lineHeight:1.5 }}>{copy.location.address}</p>
                  </div>
                </div>
                {[
                  {i:"🏖️", l: copy.location.beach},
                  {i:"🚶", l: copy.location.malecon},
                  {i:"✈️", l: copy.location.airport},
                ].map((x,i) => (
                  <div key={i} style={{ display:"flex", alignItems:"center", gap:12, marginBottom:12, padding:"11px 15px", background:"rgba(45,198,184,.06)", borderLeft:"2px solid rgba(45,198,184,.4)" }}>
                    <span>{x.i}</span>
                    <span style={{ fontFamily:"'Jost',sans-serif", fontSize:".82rem", color:"#444" }}>{x.l}</span>
                  </div>
                ))}
              </div>
            </FadeIn>
            <FadeIn delay={0.12}>
              <div className="map-grid" style={{ height:380, borderRadius:4, display:"flex", alignItems:"center", justifyContent:"center", position:"relative" }}>
                <div style={{ textAlign:"center", position:"relative", zIndex:1 }}>
                  <div style={{ width:46, height:46, borderRadius:"50% 50% 50% 0", transform:"rotate(-45deg)", background:"#111", margin:"0 auto 14px", display:"flex", alignItems:"center", justifyContent:"center", boxShadow:"0 4px 16px rgba(0,0,0,.3)" }}>
                    {I("MapPin",19,"white",{transform:"rotate(45deg)"})}
                  </div>
                  <div style={{ background:"rgba(255,255,255,.92)", backdropFilter:"blur(8px)", padding:"12px 20px", borderRadius:4, boxShadow:"0 4px 18px rgba(0,0,0,.1)" }}>
                    <p style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"1rem", fontWeight:600, color:"#111", margin:0 }}>Apartments Tukano</p>
                    <p style={{ fontFamily:"'Jost',sans-serif", fontSize:".68rem", color:"#888", margin:"2px 0 0", letterSpacing:".05em" }}>Mahahual, Costa Maya</p>
                  </div>
                  <p style={{ fontFamily:"'Jost',sans-serif", fontSize:".7rem", color:"rgba(13,61,56,.45)", marginTop:14, letterSpacing:".04em" }}>
                    Embed your Google Maps iframe here
                  </p>
                </div>
              </div>
            </FadeIn>
          </div>
        </div>
      </section>

      {/* ── FOOTER ── */}
      <footer style={{ background:"#111", color:"white", padding:"56px 0 28px" }}>
        <div style={{ maxWidth:1180, margin:"0 auto", padding:"0 24px" }}>
          <div className="footer-cols" style={{ display:"grid", gridTemplateColumns:"2fr 1fr 1fr", gap:44, marginBottom:44 }}>
            <div>
              <div style={{ display:"flex", alignItems:"center", gap:14, marginBottom:16 }}>
                <img src={LOGO_SRC} alt="Tukano" style={{ height:52, width:"auto", objectFit:"contain" }} />
                <div>
                  <h3 style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"1.6rem", fontWeight:300, margin:0, color:"white" }}>Apartments Tukano</h3>
                  <p style={{ fontFamily:"'Jost',sans-serif", fontSize:".6rem", letterSpacing:".28em", textTransform:"uppercase", color:"rgba(45,198,184,.65)", margin:"2px 0 0" }}>{copy.footer.tagline}</p>
                </div>
              </div>
              <p style={{ fontFamily:"'Jost',sans-serif", fontSize:".85rem", fontWeight:300, color:"rgba(255,255,255,.38)", lineHeight:1.75, maxWidth:300, margin:0 }}>
                Fully furnished 2 and 3-bedroom apartments in Mahahual, steps from the Caribbean — ideal for families, groups, and extended stays on the Costa Maya.
              </p>
            </div>
            <div>
              <h4 style={{ fontFamily:"'Jost',sans-serif", fontSize:".67rem", letterSpacing:".2em", textTransform:"uppercase", color:"rgba(255,255,255,.35)", margin:"0 0 18px", fontWeight:500 }}>Navigate</h4>
              <div style={{ display:"flex", flexDirection:"column", gap:11 }}>
                {navLinks.map(([k,v]) => (
                  <span key={k} onClick={() => scrollTo(k)}
                    style={{ fontFamily:"'Jost',sans-serif", fontSize:".85rem", fontWeight:300, color:"rgba(255,255,255,.55)", cursor:"pointer", transition:"color .2s" }}
                    onMouseEnter={e => e.target.style.color="var(--teal)"}
                    onMouseLeave={e => e.target.style.color="rgba(255,255,255,.55)"}>
                    {v}
                  </span>
                ))}
              </div>
            </div>
            <div>
              <h4 style={{ fontFamily:"'Jost',sans-serif", fontSize:".67rem", letterSpacing:".2em", textTransform:"uppercase", color:"rgba(255,255,255,.35)", margin:"0 0 18px", fontWeight:500 }}>Connect</h4>
              <div style={{ display:"flex", gap:12, marginBottom:20 }}>
                {["Instagram","Facebook"].map((name,i) => (
                  <a key={i} href="#"
                    style={{ width:36, height:36, borderRadius:"50%", border:"1px solid rgba(255,255,255,.12)", display:"flex", alignItems:"center", justifyContent:"center", color:"rgba(255,255,255,.5)", transition:"all .25s" }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor="rgba(45,198,184,.5)"; e.currentTarget.style.background="rgba(45,198,184,.08)"; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor="rgba(255,255,255,.12)"; e.currentTarget.style.background="transparent"; }}>
                    {I(name,15)}
                  </a>
                ))}
              </div>
              <a href="mailto:aaron@vanwachem.ca"
                style={{ display:"flex", alignItems:"center", gap:8, color:"var(--teal)", fontFamily:"'Jost',sans-serif", fontSize:".8rem", textDecoration:"none" }}>
                {I("Mail",13)} aaron@vanwachem.ca
              </a>
            </div>
          </div>
          <div style={{ borderTop:"1px solid rgba(255,255,255,.07)", paddingTop:24, display:"flex", justifyContent:"space-between", flexWrap:"wrap", gap:10 }}>
            <p style={{ fontFamily:"'Jost',sans-serif", fontSize:".72rem", fontWeight:300, color:"rgba(255,255,255,.25)", margin:0 }}>{copy.footer.rights}</p>
            <p style={{ fontFamily:"'Jost',sans-serif", fontSize:".72rem", fontWeight:300, color:"rgba(255,255,255,.18)", margin:0 }}>
              Mahahual vacation rentals · Costa Maya apartments · Apartments Tukano
            </p>
          </div>
        </div>
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
