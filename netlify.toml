# Apartments Tukano — plain HTML site, no build step.
[build]
  publish = "."

# Send the Netlify address to the real domain.
# Deploy previews use a different address (deploy-preview-N--...), so they keep working.
[[redirects]]
  from = "https://frolicking-jelly-3f63fb.netlify.app/*"
  to = "https://tukanomahahual.com/:splat"
  status = 301
  force = true

# Send www to the real domain.

[[redirects]]
  from = "https://www.tukanomahahual.com/*"
  to = "https://tukanomahahual.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Drafts and snippets kept in the repo are never served.
[[redirects]]
  from = "/_drafts/*"
  to = "/404.html"
  status = 404
  force = true
